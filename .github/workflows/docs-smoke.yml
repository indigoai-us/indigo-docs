name: Docs smoke

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-smoke
  cancel-in-progress: false

jobs:
  fleet-agents:
    name: Fleet Agents routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe published pages
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            fleet-agents
            fleet-agents/create
            fleet-agents/configuration
            fleet-agents/channels
            fleet-agents/access
            fleet-agents/operations
          )

          for route_name in "${routes[@]}"; do
            page_url="https://docs.getindigo.ai/hq/products/${route_name}/"
            echo "Checking ${page_url}"
            curl --fail --show-error --silent --location \
              --retry 3 --retry-delay 2 --output /dev/null "${page_url}"
          done

      - name: Verify Fleet Agents content and legacy redirect
        shell: bash
        run: |
          set -euo pipefail

          overview=$(curl --fail --show-error --silent --retry 3 \
            https://docs.getindigo.ai/hq/products/fleet-agents/)
          grep --fixed-strings --quiet 'Fleet Agents' <<<"${overview}"

          legacy=$(curl --fail --show-error --silent --retry 3 \
            https://docs.getindigo.ai/hq/products/capabilities/agents-in-slack/)
          grep --fixed-strings --quiet \
            'url=/hq/products/fleet-agents/channels/' <<<"${legacy}"
